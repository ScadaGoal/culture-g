name: Episode quotidien

on:
  schedule:
    # Trois declenchements par nuit (UTC). GitHub execute les taches planifiees "au
    # mieux" : on a mesure jusqu'a 5 h de retard sur un cron unique. Le premier run
    # qui aboutit publie l'episode ; les suivants constatent qu'il existe et s'arretent
    # en quelques secondes (--skip-if-published). Ils rattrapent aussi un run echoue.
    # Minutes non rondes : la file d'attente de GitHub est encombree a l'heure pile.
    - cron: "23 0 * * *"
    - cron: "23 2 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Fenetre de collecte (ex. 26h, 7d)"
        required: false
        default: "26h"
      dry_run:
        description: "Generer le script sans audio"
        type: boolean
        required: false
        default: false

# Un seul episode a la fois : deux runs concurrents se marcheraient dessus au commit.
concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    # La generation atteint 43 min certains jours : l'ancien plafond de 45 min coupait
    # un run sur trois juste avant la publication, et tout le travail etait perdu.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generer l'episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python -m culture_g.run \
            --since "${{ inputs.since || '26h' }}" \
            ${{ github.event_name == 'schedule' && '--skip-if-published' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee state/run.log

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          # Rien a committer les jours sans nouveaute : ce n'est pas une erreur.
          if git diff --staged --quiet; then
            echo "Aucun changement, rien a publier."
            exit 0
          fi
          git commit -m "Episode du $(date -u +%Y-%m-%d)"
          # Le depot a pu bouger pendant la generation (~10 min).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # Aussi sur annulation (timeout) : c'est justement le cas ou l'on a besoin du
      # journal chronometre pour savoir quelle etape a devore le temps.
      - name: Archiver le diagnostic en cas d'echec
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: |
            state/run.log
            state/script-*.txt
            state/models.json
          retention-days: 7
          if-no-files-found: ignore
